[package]
name = "tpt-chem-verify"
description = "Verification harnesses: proptest strategies, conservation-law checks, Kani proofs"
keywords = ["verification", "property-testing", "kani", "proptest"]
categories = ["science", "development-tools::testing"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
tpt-chem-core = { workspace = true }
tpt-chem-md = { workspace = true }
tpt-chem-kinetics = { workspace = true }
proptest = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(kani)'] }

[lints.clippy]
all = "warn"
