[package]
name = "tpt-chem-core"
description = "Foundation layer: molecular graphs, force fields, physical constants, unit-safe types"
keywords = ["chemistry", "molecular-dynamics", "force-fields", "no-std"]
categories = ["science"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["std"]
# When disabled the crate is `no_std + alloc` (float transcendental math via libm).
std = ["tpt-math-units/std"]
# Serialize/deserialize the core types (no_std-compatible via `alloc`).
serde = ["dep:serde"]

[dependencies]
tpt-math-units = { workspace = true, default-features = false }
libm = { workspace = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints]
workspace = true
