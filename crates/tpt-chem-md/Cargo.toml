[package]
name = "tpt-chem-md"
description = "Classical molecular dynamics: integrators, thermostats, neighbor lists, Ewald/PME electrostatics"
keywords = ["molecular-dynamics", "chemistry", "simulation", "ewald", "pme"]
categories = ["science::computational-chemistry::molecular-simulation", "simulation"]
readme = "README.md"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
# Serialize MD state and topology types (forwards to tpt-chem-core/serde).
serde = ["dep:serde", "tpt-chem-core/serde"]

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
tpt-chem-core = { workspace = true }
# 1D FFTs composed into 3D transforms for Particle Mesh Ewald (stands in for
# the never-created `tpt-dsp`, see workspace Cargo.toml note).
tpt-math-signal-fft = { workspace = true }

[lints]
workspace = true
