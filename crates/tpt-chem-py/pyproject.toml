[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "tpt-chem"
description = "Python bindings for tpt-chemistry: RHF/STO-3G energies and SMILES helpers"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
version = "0.1.0"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[tool.maturin]
module-name = "tpt_chem"
