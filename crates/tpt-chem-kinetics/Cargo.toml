[package]
name = "tpt-chem-kinetics"
description = "Reaction kinetics: mass-action ODEs, Gillespie SSA, Arrhenius and Eyring rate laws"
keywords = ["chemistry", "kinetics", "gillespie", "reaction-network"]
categories = ["science"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
# Serialize result and network types.
serde = ["dep:serde"]

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
tpt-chem-core = { workspace = true }

[lints]
workspace = true
