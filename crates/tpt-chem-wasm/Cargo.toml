[package]
name = "tpt-chem-wasm"
description = "WebAssembly bindings: RHF/STO-3G energies and SMILES helpers for browsers and Node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
# Build artefacts go to `pkg/` with `wasm-pack`; the crate is not published.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-chem-io = { workspace = true }
tpt-chem-quantum = { workspace = true }
wasm-bindgen = "0.2"

[lints.clippy]
all = "warn"

# wasm-bindgen's generated glue contains `unsafe`, which the workspace's
# `forbid(unsafe_code)` would reject, so this crate sets its own lint table.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

# rustc emits bulk-memory and non-trapping float-to-int instructions for
# wasm32; wasm-opt rejects them unless the features are enabled explicitly.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
