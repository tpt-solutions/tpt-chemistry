[package]
name = "tpt-chemistry"
description = "Umbrella crate: pure-Rust computational chemistry — MD, quantum, kinetics, crystallography"
keywords = ["chemistry", "molecular-dynamics", "quantum-chemistry", "simulation"]
categories = ["science"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
core = ["dep:tpt-chem-core"]
io = ["dep:tpt-chem-io"]
md = ["dep:tpt-chem-md"]
quantum = ["dep:tpt-chem-quantum"]
kinetics = ["dep:tpt-chem-kinetics"]
crystal = ["dep:tpt-chem-crystal"]
verify = ["dep:tpt-chem-verify"]

[dependencies]
tpt-chem-core = { workspace = true, optional = true }
tpt-chem-io = { workspace = true, optional = true }
tpt-chem-md = { workspace = true, optional = true }
tpt-chem-quantum = { workspace = true, optional = true }
tpt-chem-kinetics = { workspace = true, optional = true }
tpt-chem-crystal = { workspace = true, optional = true }
tpt-chem-verify = { workspace = true, optional = true }

[lints]
workspace = true

[[example]]
name = "h2_hf"
required-features = ["core", "quantum"]

[[example]]
name = "water_hf"
required-features = ["core", "quantum"]

[[example]]
name = "lj_argon_nve"
required-features = ["core", "md"]

[[example]]
name = "nacl_pme"
required-features = ["core", "md"]

[[example]]
name = "lotka_volterra_ssa"
required-features = ["core", "kinetics"]

[[example]]
name = "michaelis_menten"
required-features = ["core", "kinetics"]

[[example]]
name = "silicon_xrd"
required-features = ["core", "crystal"]

[[example]]
name = "nacl_xrd"
required-features = ["core", "crystal"]

[[example]]
name = "cif_to_xrd"
required-features = ["core", "io", "crystal"]

[[bin]]
name = "tpt-chem"
path = "src/bin/tpt-chem.rs"
required-features = ["core", "io", "quantum", "crystal", "md", "kinetics"]

[[example]]
name = "water_pme"
required-features = ["core", "md"]
