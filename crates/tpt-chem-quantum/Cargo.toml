[package]
name = "tpt-chem-quantum"
description = "Electronic structure: Gaussian basis sets, McMurchie-Davidson integrals, SCF / Hartree-Fock"
keywords = ["quantum-chemistry", "hartree-fock", "scf", "basis-set", "gaussian-basis"]
categories = ["science::computational-chemistry::electronic-structure"]
readme = "README.md"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
# Serialize result types (forwards to tpt-chem-core/serde).
serde = ["dep:serde", "tpt-chem-core/serde"]
# Parallel Fock-matrix build over shell quartets (rayon).
rayon = ["dep:rayon"]

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
tpt-chem-core = { workspace = true }
rayon = { workspace = true, optional = true }
# NOTE: spec.txt §4 says HF "relies on tpt-math for dense eigenvalue
# decomposition", but `tpt-math-linalg-dense` exposes no eigensolver and
# `nalgebra` is Apache-2.0-only (banned by the workspace license policy).
# The Roothaan-Hall equations are therefore solved by a from-scratch cyclic
# Jacobi eigensolver in this crate (see `linalg.rs`), consistent with
# spec.txt §2's from-scratch philosophy.

[lints]
workspace = true
