[package]
name = "tpt-chem-crystal"
description = "Solid state: Bravais lattices, space groups, reciprocal space, k-point grids, XRD simulation"
keywords = ["crystallography", "solid-state", "xrd", "bravais", "space-group"]
categories = ["science::materials"]
readme = "README.md"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
# Serialize result and network types.
serde = ["dep:serde", "tpt-chem-core/serde"]

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
tpt-chem-core = { workspace = true }

[lints]
workspace = true
