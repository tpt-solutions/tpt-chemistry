name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# The workspace depends on the sibling repository `tpt-math` via path deps
# (`../tpt-math/...`), so every job checks out both repositories side by
# side: `<workspace>/tpt-chemistry` and `<workspace>/tpt-math`.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: tpt-chemistry
      - uses: actions/checkout@v7
        with:
          repository: tpt-solutions/tpt-math
          path: tpt-math
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: tpt-chemistry

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: tpt-chemistry
      - uses: actions/checkout@v7
        with:
          repository: tpt-solutions/tpt-math
          path: tpt-math
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: tpt-chemistry

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: tpt-chemistry
      - uses: actions/checkout@v7
        with:
          repository: tpt-solutions/tpt-math
          path: tpt-math
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
        working-directory: tpt-chemistry
      - run: cargo doc --workspace --no-deps --all-features
        working-directory: tpt-chemistry
        env:
          RUSTDOCFLAGS: -D warnings

  # Line coverage as an LCOV report artifact. Informational only: it does not
  # gate merges until a coverage floor has been agreed.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: tpt-chemistry
      - uses: actions/checkout@v7
        with:
          repository: tpt-solutions/tpt-math
          path: tpt-math
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
        working-directory: tpt-chemistry
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: tpt-chemistry/lcov.info

  # Builds on the oldest supported toolchain, matching `rust-version` in the
  # workspace Cargo.toml. Dependencies resolve fresh here (Cargo.lock is not
  # committed), so a newer transitive dependency can break this job first.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: tpt-chemistry
      - uses: actions/checkout@v7
        with:
          repository: tpt-solutions/tpt-math
          path: tpt-math
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --workspace --all-targets
        working-directory: tpt-chemistry

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: tpt-chemistry
      - uses: actions/checkout@v7
        with:
          repository: tpt-solutions/tpt-math
          path: tpt-math
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
        working-directory: tpt-chemistry

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: tpt-chemistry
      - uses: actions/checkout@v7
        with:
          repository: tpt-solutions/tpt-math
          path: tpt-math
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - name: Build tpt-chem-core for a no_std target
        run: cargo build -p tpt-chem-core --target thumbv6m-none-eabi --no-default-features
        working-directory: tpt-chemistry

  # Kani does not support Windows hosts; bounded model checking runs on the
  # Linux CI runner via the harnesses in crates/tpt-chem-verify.
  # One job per harness so a slow proof is isolated and capped by its own
  # timeout instead of holding the whole run open.
  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        harness:
          - cell_index_in_bounds
          - ewald_reciprocal_indices_in_range
          - verlet_needs_update_monotone
          - scf_density_is_psd
          - eri_r_zero_no_panic
          - eri_p_shell_coincident_no_panic
    steps:
      - uses: actions/checkout@v7
        with:
          path: tpt-chemistry
      - uses: actions/checkout@v7
        with:
          repository: tpt-solutions/tpt-math
          path: tpt-math
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - run: cargo kani -p tpt-chem-verify --harness ${{ matrix.harness }}
        working-directory: tpt-chemistry
        timeout-minutes: 30

  # Criterion benchmarks in libtest "bencher" format, compared against the
  # stored baseline on master. Alerts comment on the pull request; they do
  # not fail the job until the threshold has been tuned on real runner noise.
  bench:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: tpt-chemistry
      - uses: actions/checkout@v7
        with:
          repository: tpt-solutions/tpt-math
          path: tpt-math
      - uses: dtolnay/rust-toolchain@stable
      - name: Run criterion benchmarks
        working-directory: tpt-chemistry
        run: |
          cargo bench -p tpt-chem-md --bench force_kernels -- --output-format bencher | tee bench.txt
          cargo bench -p tpt-chem-quantum --bench rhf_water -- --output-format bencher | tee -a bench.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-output
          path: tpt-chemistry/bench.txt

  # benchmark-action runs git from the workspace root and has no input to
  # point it elsewhere, so the tracking step runs in its own job with the
  # repository checked out at the root. The benchmark output comes from `bench`.
  bench-track:
    needs: bench
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: bench-output
      - uses: benchmark-action/github-action-benchmark@v1
        with:
          name: tpt-chemistry criterion
          tool: cargo
          output-file-path: bench.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          comment-on-alert: ${{ github.event_name == 'pull_request' }}
          alert-threshold: "150%"
          fail-on-alert: false
