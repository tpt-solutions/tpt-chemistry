name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# The workspace depends on the sibling repository `tpt-math` via path deps
# (`../tpt-math/...`), so every job checks out both repositories side by
# side: `<workspace>/tpt-chemistry` and `<workspace>/tpt-math`.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: tpt-chemistry
      - uses: actions/checkout@v7
        with:
          repository: tpt-solutions/tpt-math
          path: tpt-math
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: tpt-chemistry

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: tpt-chemistry
      - uses: actions/checkout@v7
        with:
          repository: tpt-solutions/tpt-math
          path: tpt-math
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: tpt-chemistry

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: tpt-chemistry
      - uses: actions/checkout@v7
        with:
          repository: tpt-solutions/tpt-math
          path: tpt-math
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
        working-directory: tpt-chemistry
      - run: cargo doc --workspace --no-deps --all-features
        working-directory: tpt-chemistry
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: tpt-chemistry
      - uses: actions/checkout@v7
        with:
          repository: tpt-solutions/tpt-math
          path: tpt-math
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
        working-directory: tpt-chemistry

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: tpt-chemistry
      - uses: actions/checkout@v7
        with:
          repository: tpt-solutions/tpt-math
          path: tpt-math
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - name: Build tpt-chem-core for a no_std target
        run: cargo build -p tpt-chem-core --target thumbv6m-none-eabi --no-default-features
        working-directory: tpt-chemistry

  # Kani does not support Windows hosts; bounded model checking runs on the
  # Linux CI runner via the harnesses in crates/tpt-chem-verify.
  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: tpt-chemistry
      - uses: actions/checkout@v7
        with:
          repository: tpt-solutions/tpt-math
          path: tpt-math
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - run: cargo kani --workspace
        working-directory: tpt-chemistry

  # Criterion benchmarks in libtest "bencher" format, compared against the
  # stored baseline on master. Alerts comment on the pull request; they do
  # not fail the job until the threshold has been tuned on real runner noise.
  bench:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: tpt-chemistry
      - uses: actions/checkout@v7
        with:
          repository: tpt-solutions/tpt-math
          path: tpt-math
      - uses: dtolnay/rust-toolchain@stable
      - name: Run criterion benchmarks
        working-directory: tpt-chemistry
        run: |
          cargo bench -p tpt-chem-md --bench force_kernels -- --output-format bencher | tee bench.txt
          cargo bench -p tpt-chem-quantum --bench rhf_water -- --output-format bencher | tee -a bench.txt
      - uses: benchmark-action/github-action-benchmark@v1
        with:
          name: tpt-chemistry criterion
          tool: cargo
          output-file-path: tpt-chemistry/bench.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          comment-on-alert: ${{ github.event_name == 'pull_request' }}
          alert-threshold: "150%"
          fail-on-alert: false
